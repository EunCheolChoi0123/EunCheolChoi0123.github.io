title: Eun Cheol Choi
description: I am a PhD candidate in Communication and an MS in Computer Science at the University of Southern California. My research bridges social science and computation, examining how large language models, social networks, and information systems shape human beliefs and behaviors. I am interested in topics including misinformation dynamics, AI-driven fact-checking, and labor market exposure to automation.
